<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tidak ada koneksi — Catatan Usaha</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f1f5f9;
            color: #0f172a;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            text-align: center;
        }
        .card { max-width: 22rem; }
        .icon {
            width: 56px; height: 56px; margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
            background: #0f766e; border-radius: 16px; color: #fff;
        }
        h1 { margin: 0 0 8px; font-size: 1.125rem; }
        p { margin: 0 0 24px; font-size: 0.875rem; line-height: 1.6; color: #64748b; }
        button {
            width: 100%; padding: 14px; border: 0; border-radius: 12px;
            background: #0f766e; color: #fff;
            font-size: 1rem; font-weight: 600; font-family: inherit; cursor: pointer;
        }
        button:active { background: #115e59; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 20h.01" />
                <path d="M8.5 16.4a5 5 0 0 1 7 0" />
                <path d="M5 12.9a10 10 0 0 1 5.2-2.7" />
                <path d="M19 12.9a10 10 0 0 0-2-1.5" />
                <path d="M2 8.8a15 15 0 0 1 4.2-2.6" />
                <path d="M22 8.8a15 15 0 0 0-11.3-3.8" />
                <path d="m2 2 20 20" />
            </svg>
        </div>
        <h1>Tidak ada koneksi</h1>
        <p>
            Catatan Usaha butuh internet untuk menyimpan dan menampilkan transaksi.
            Periksa koneksi kamu, lalu coba lagi.
        </p>
        <button onclick="location.reload()">Coba lagi</button>
    </div>
</body>
</html>
