# Railway membangun aplikasi ini dengan Nixpacks.
# Berkas ini hanya menambahkan langkah yang tidak terdeteksi otomatis:
# membangun aset Vite dan menyiapkan cache Laravel.

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist",
    "npm ci",
    "npm run build",
]

[phases.caches]
dependsOn = ["build"]
# Route dan view aman di-cache saat build karena isinya tidak bergantung
# environment. Config sengaja TIDAK di-cache di sini: nilainya berasal dari
# variabel Railway yang baru tersedia saat aplikasi berjalan.
cmds = [
    "php artisan route:cache",
    "php artisan view:cache",
]
